<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>메어샤비 타로타로♪</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a0f1a 0%, #2d1b2e 20%, #4a2c54 40%, #2d1b2e 60%, #1a0f1a 80%, #000 100%);
            color: #ffc0cb;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            margin: 0;
            padding: 0;
        }

        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .star {
            position: absolute;
            width: 3px;
            height: 3px;
            background: white;
            border-radius: 50%;
            animation: sparkle 2s infinite;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
        }

        @keyframes sparkle {
            0%, 100% { 
                opacity: 0.3; 
                transform: scale(1);
            }
            50% { 
                opacity: 1; 
                transform: scale(1.5);
            }
        }

        .container {
            position: relative;
            z-index: 2;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px 20px 20px;
        }

        .header-image {
            width: 100vw;
            height: auto;
            object-fit: contain;
            margin-bottom: 20px;
            margin-left: calc(-50vw + 50%);
            margin-right: calc(-50vw + 50%);
        }

        .header-image.mobile {
            display: none;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .title {
            font-size: 3rem;
            margin-bottom: 10px;
            margin-top: 20px;
            background: linear-gradient(45deg, #ffb3d9, #ff69b4, #ffc0cb, #ffb3d9);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 20px rgba(255, 179, 217, 0.6);
            font-weight: bold;
        }

        .subtitle {
            font-size: 1.2rem;
            color: #ffb3d9;
            margin-bottom: 30px;
            text-shadow: 0 0 10px rgba(255, 192, 203, 0.5);
        }

        .card-area {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 400px;
            margin: 40px 0;
        }

        .card-deck {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            max-width: 800px;
            position: relative;
        }

        .tarot-card {
            width: 120px;
            height: 200px;
            border-radius: 15px;
            cursor: pointer;
            position: relative;
            border: 3px solid #ffb3d9;
            box-shadow: 0 8px 25px rgba(255, 179, 217, 0.4);
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .tarot-card:hover {
            transform: translateY(-10px) scale(1.05);
            box-shadow: 0 15px 35px rgba(255, 179, 217, 0.6);
        }

        .card-back {
            width: 100%;
            height: 100%;
            background-image: url('file_00000000975861f8ae5cac297feb4774.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            border-radius: 12px;
        }

        .card-front {
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            display: none;
            border-radius: 12px;
        }

        .card-front.active {
            display: block;
        }

        .selected-cards {
            display: flex;
            justify-content: center;
            gap: 40px;
            flex-wrap: wrap;
            margin-top: 40px;
        }

        .selected-card-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 20px;
        }

        .selected-card {
            width: 250px;
            height: 410px;
            border-radius: 20px;
            border: 4px solid #ff69b4;
            box-shadow: 0 15px 40px rgba(255, 105, 180, 0.5);
            overflow: hidden;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            position: relative;
        }

        .selected-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, rgba(255, 105, 180, 0.1), rgba(218, 112, 214, 0.1));
            z-index: 1;
        }

        .card-info {
            margin-top: 15px;
            text-align: center;
            max-width: 250px;
        }

        .card-name {
            font-size: 1.5rem;
            font-weight: bold;
            color: #ffb3d9;
            text-shadow: 0 2px 4px rgba(255, 179, 217, 0.5);
            margin-bottom: 8px;
        }

        .card-meaning {
            font-size: 1rem;
            line-height: 1.4;
            color: #ffc0cb;
            text-shadow: 0 1px 2px rgba(255, 192, 203, 0.3);
        }

        .reading-result {
            background: rgba(255, 240, 245, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            margin-top: 40px;
            border: 2px solid rgba(255, 105, 180, 0.3);
            box-shadow: 0 8px 32px rgba(255, 105, 180, 0.3);
        }

        .reading-title {
            font-size: 1.5rem;
            text-align: center;
            margin-bottom: 20px;
            color: #8b4cb8;
            text-shadow: 0 2px 4px rgba(255, 105, 180, 0.3);
        }

        .reading-text {
            font-size: 1.1rem;
            line-height: 1.8;
            text-align: center;
            color: #4a2c54;
        }

        .shuffle-btn {
            display: block;
            margin: 30px auto;
            padding: 15px 30px;
            background: linear-gradient(45deg, #ffb3d9, #ffc0cb);
            border: none;
            border-radius: 30px;
            color: #4a2c54;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 6px 20px rgba(255, 179, 217, 0.4);
        }

        .shuffle-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(255, 179, 217, 0.6);
            background: linear-gradient(45deg, #ffc0cb, #ffb3d9);
        }

        .instructions {
            text-align: center;
            margin: 30px 0;
            font-size: 1.1rem;
            color: #ffb3d9;
            text-shadow: 0 1px 2px rgba(255, 179, 217, 0.5);
        }

        @media (max-width: 768px) {
            .title {
                font-size: 2rem;
            }
            
            .tarot-card {
                width: 100px;
                height: 160px;
            }
            
            .selected-card {
                width: 200px;
                height: 330px;
            }
            
            .card-info {
                max-width: 200px;
            }
            
            .card-name {
                font-size: 1.2rem;
            }
            
            .card-meaning {
                font-size: 0.9rem;
            }

            .selected-cards {
                gap: 30px;
            }

            .header-image.desktop {
                display: none;
            }

            .header-image.mobile {
                display: block;
                min-height: 150px;
                object-fit: cover;
            }
        }
    </style>
</head>
<body>
    <div class="stars" id="stars"></div>
    
    <div class="container">
        <div class="header">
            <!-- PC용 헤더 이미지 -->
            <img src="header-pc.jpg" alt="Nmare & 샤비 PC 헤더" class="header-image desktop" id="headerImagePc">
            <!-- 모바일용 헤더 이미지 -->
            <img src="무제94_20250712135058.png" alt="Nmare & 샤비 모바일 헤더" class="header-image mobile" id="headerImageMobile">
            
            <h1 class="title">🌙 Nmare & 샤비의   타로 타로 ✨️</h1>
            <p class="subtitle">✦오늘의 운세가 궁금해? 어서 카드를 뽑아봐~⊹.˚✦</p>
        </div>

        <div class="instructions" id="instructions">
            마음속으로 질문을 떠올리고 카드 한 장을 선택해주세요
        </div>

        <div class="card-area">
            <div class="card-deck" id="cardDeck">
                <!-- 카드들이 여기에 생성됩니다 -->
            </div>
        </div>

        <div class="selected-cards" id="selectedCards"></div>

        <div class="reading-result" id="readingResult" style="display: none;"></div>

        <button class="shuffle-btn" onclick="shuffleCards()">✦카드 다시 섞기✦</button>
    </div>

    <script>
        // 타로 카드 데이터 (각 카드에 고유한 해석 추가)
        const tarotCards = [
            { 
                name: "바보", 
                meaning: "새로운 시작, 순수함, 모험", 
                symbol: "🃏", 
                image: "fool.jpg",
                reading: "바보 카드가 나타났어요! 지금이 바로 새로운 시작을 할 때에요. 두려워하지 말고 순수한 마음으로 첫 걸음을 내딛어 보세요. 때로는 계획 없이 직감을 따르는 것이 최고의 모험이 될 수 있답니다. 미지의 세계로 떠나는 여정, 그 자체가 당신에게 가장 큰 선물이 될 거예요! -샤비-"
            },
            { 
                name: "마법사", 
                meaning: "의지력, 창조력, 실현", 
                symbol: "🎭", 
                image: "file_0000000079dc61f5acced438d0dbe484.png",
                reading: "마법사 카드가 당신을 선택했어요! 지금 당신 안에는 무한한 창조의 힘이 잠들어 있어요. 원하는 것을 이룰 수 있는 모든 도구와 능력이 이미 갖춰져 있답니다. 이제 필요한 건 강한 의지와 행동뿐이에요. 당신의 손끝에서 마법이 일어날 거예요! -샤비-"
            },
            { 
                name: "운명의 수레바퀴", 
                meaning: "변화, 운명, 순환", 
                symbol: "🎡", 
                image: "무제98_20250715214836.png",
                reading: "운명의 수레바퀴가 돌아가고 있네요. 인생의 흐름 속에서 지금은 중요한 전환점에 서 있어요. 좋은 일이든 나쁜 일이든, 모든 것은 순환하며 변화합니다. 지금의 상황을 받아들이고 흐름에 몸을 맡겨보세요. 수레바퀴는 멈추지 않고 계속 돌아가니까요. -Nmare-"
            },
            { 
                name: "악마", 
                meaning: "유혹, 속박, 물질적 욕망", 
                symbol: "😈", 
                image: "file_0000000097c0622fb7a881c2ac4393c7.png",
                reading: "악마 카드가 나타났군요. 지금 무언가에 속박되어 있거나, 유혹에 이끌리고 있진 않나요? 물질이나 욕망에 사로잡혀 본질을 잃지 않도록 조심하세요. 하지만 이 카드는 경고인 동시에 해방의 메시지이기도 합니다. 당신을 묶고 있는 사슬은 당신만이 끊을 수 있어요. -Nmare-"
            },
            { 
                name: "죽음", 
                meaning: "변화, 끝과 시작, 변환", 
                symbol: "🦋", 
                image: "무제98_20250716150413.png",
                reading: "죽음 카드를 두려워하지 마세요. 이 카드는 끝이 아닌 새로운 시작을 의미합니다. 낡은 것이 사라져야 새로운 것이 자리할 수 있어요. 애벌레가 나비가 되듯, 지금은 완전한 변화와 재탄생의 시간입니다. 과거를 놓아주고 새로운 당신으로 거듭나세요. -Nmare-"
            },
            { 
                name: "샤비", 
                meaning: "환각, 망상, 낙원", 
                symbol: "🎀", 
                image: "file_00000000893061f89966fcacd8d614dc.png",
                reading: "샤비 카드가 나왔어요~! 지금 당신은 달콤한 환상 속에 빠져있을지도 몰라요. 때로는 현실을 벗어나 꿈같은 세계에 머무는 것도 좋지만, 너무 오래 머물면 길을 잃을 수 있답니다. 낙원 같은 순간을 즐기되, 현실로 돌아올 길은 항상 기억하고 있어야 해요! 꿈과 현실의 균형, 그게 중요해요~ -샤비-"
            },
            { 
                name: "Nmare", 
                meaning: "악몽, 꿈, 고통", 
                symbol: "🖤", 
                image: "file_000000003f0061f8b90d89bac5b3a3d7.png",
                reading: "Nmare 카드가 나타났군요. 지금 당신은 어둠 속을 헤매고 있거나, 깊은 고민에 빠져있을 수 있어요. 악몽 같은 시간이지만, 이 또한 지나갈 거예요. 가장 어두운 밤이 지나면 새벽이 오듯이요. 고통스러운 경험들도 결국 당신을 더 강하게 만들 거예요. 어둠을 두려워하지 마세요, 그 속에서 진정한 자신을 발견할 수 있으니까요. -Nmare-"
            },
            { 
                name: "샌즈", 
                meaning: "가스터블래스터, 존나어렵습니다, 메갈로바니아", 
                symbol: "☠️", 
                image: "file_0000000095c8623087fb2874e56386fc.png",
                reading: "샌즈 카드가 나왔네요. 준비하세요, 지금부터 쉽지 않은 시간이 시작될 거예요. 하지만 어려운 도전이야말로 당신을 성장시키는 기회입니다. Bad Time이 될 수도 있지만, 포기하지 않는다면 결국 이겨낼 수 있어요. 메갈로바니아가 울려퍼지는 순간, 당신의 진정한 힘이 발휘될 거예요! 아자아자 화이팅! -샤비-"
            },
            { 
                name: "욕망의 항아리", 
                meaning: "욕망, 열망, 마법카드", 
                symbol: "⚱️", 
                image: "다운로드파일_20250716_152604.jpg",
                reading: "욕망의 항아리가 열렸어요! 지금 당신의 마음속에는 강렬한 소망이 자리하고 있네요. 이 항아리는 당신이 진정으로 원하는 것이 무엇인지 보여줍니다. 하지만 조심하세요, 너무 큰 욕망은 때때로 독이 될 수도 있으니까요. 당신의 열망을 긍정적인 방향으로 이끌어 간다면, 놀라운 일들이 펼쳐질 거예요! -샤비-"
            },
            { 
                name: "따뇨미", 
                meaning: "남미새, 여왕벌, 여왕개미", 
                symbol: "👧", 
                image: "file_00000000fbbc6230993401acd7cc2b3e.png",
                reading: "따뇨미 카드가 나타났어요! 작지만 강력한 존재, 그게 바로 당신이에요. 여왕벌이나 여왕개미처럼 작아도 중심이 되고 리더가 될 수 있는 힘이 있답니다. 지금은 당신이 주도권을 잡고 앞장서야 할 때예요. 작다고 무시하면 큰코다쳐요! 당신 안의 여왕의 카리스마를 발휘해보세요~ -샤비-"
            }
        ];

        let selectedCard = null;

        // 별 생성
        function createStars() {
            const starsContainer = document.getElementById('stars');
            for (let i = 0; i < 100; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.animationDelay = Math.random() * 2 + 's';
                starsContainer.appendChild(star);
            }
        }

        // 카드 덱 생성
        function createCardDeck() {
            const deck = document.getElementById('cardDeck');
            deck.innerHTML = '';
            
            // 카드 20장 생성
            for (let i = 0; i < 20; i++) {
                const card = document.createElement('div');
                card.className = 'tarot-card';
                card.innerHTML = `
                    <div class="card-back"></div>
                    <div class="card-front"></div>
                `;
                card.onclick = () => selectCard(i, card);
                deck.appendChild(card);
            }
        }

        // 카드 선택
        function selectCard(index, cardElement) {
            if (selectedCard !== null) return; // 이미 카드를 선택했으면 리턴
            
            const randomCard = tarotCards[Math.floor(Math.random() * tarotCards.length)];
            selectedCard = randomCard;
            
            // 카드 앞면으로 바로 변경
            const backFace = cardElement.querySelector('.card-back');
            const frontFace = cardElement.querySelector('.card-front');
            
            backFace.style.display = 'none';
            frontFace.style.backgroundImage = `url('${randomCard.image}')`;
            frontFace.classList.add('active');
            
            // 모든 카드 선택 불가능하게 만들기
            const allCards = document.querySelectorAll('.tarot-card');
            allCards.forEach(card => {
                card.onclick = null;
                card.style.cursor = 'default';
            });
            
            displaySelectedCard();
            updateInstructions();
            generateReading();
        }

        // 선택된 카드 표시
        function displaySelectedCard() {
            const container = document.getElementById('selectedCards');
            container.innerHTML = '';
            
            const cardContainer = document.createElement('div');
            cardContainer.className = 'selected-card-container';
            
            cardContainer.innerHTML = `
                <div class="selected-card" style="background-image: url('${selectedCard.image}')"></div>
                <div class="card-info">
                    <div class="card-name">${selectedCard.name}</div>
                    <div class="card-meaning">${selectedCard.meaning}</div>
                </div>
            `;
            container.appendChild(cardContainer);
        }

        // 지침 업데이트
        function updateInstructions() {
            const instructions = document.getElementById('instructions');
            if (selectedCard === null) {
                instructions.textContent = '마음속으로 질문을 떠올리시고 카드 한 장을 선택해주세요';
            } else {
                instructions.textContent = '선택 완료! 아래에서 리딩을 확인해보세요 ⊹.˚';
            }
        }

        // 리딩 생성
        function generateReading() {
            displayReading({
                title: "✦오늘의 메시지✦",
                text: selectedCard.reading
            });
        }

        // 리딩 결과 표시
        function displayReading(reading) {
            const resultDiv = document.getElementById('readingResult');
            resultDiv.innerHTML = `
                <div class="reading-title">${reading.title}</div>
                <div class="reading-text">${reading.text}</div>
            `;
            resultDiv.style.display = 'block';
        }

        // 카드 섞기
        function shuffleCards() {
            selectedCard = null;
            document.getElementById('selectedCards').innerHTML = '';
            document.getElementById('readingResult').style.display = 'none';
            updateInstructions();
            
            // 카드 덱 재생성
            createCardDeck();
        }

        // 초기화
        document.addEventListener('DOMContentLoaded', function() {
            createStars();
            createCardDeck();
            updateInstructions();
        });
    </script>
</body>
</html>
